<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nubian Platform</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --caption-color: #666666;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px; /* Expanded slightly for ideal side-by-side spacing */
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 60px 0 40px 0;
        }
        h1 { margin: 0 0 10px 0; font-size: 2rem; font-weight: 600; }
        .subtitle { color: var(--caption-color); margin: 0; font-size: 1rem; text-transform: lowercase; }
        
        /* The Side-by-Side Flex Layout */
        .photo-stream {
            display: flex;
            flex-direction: column;
            gap: 80px; /* Space between rows */
            margin-top: 40px;
        }
        .photo-row {
            display: flex;
            align-items: center; /* Centers items vertically next to each other */
            gap: 40px;
            width: 100%;
        }
        
        /* Automatically flips direction on every second image item */
        .photo-row:nth-child(even) {
            flex-direction: row-reverse;
        }
        
        /* 60% Image / 40% Text Proportion Split */
        .photo-box {
            flex: 3; 
        }
        .photo-box img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 4px;
        }
        .text-box {
            flex: 2;
        }
        .photo-date {
            font-size: 0.8rem;
            color: var(--caption-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }
        .photo-caption {
            font-size: 0.95rem;
            margin: 0;
        }

        /* Mobile View: Stack gracefully back into a simple column on mobile viewports */
        @media (max-width: 768px) {
            .photo-row, .photo-row:nth-child(even) {
                flex-direction: column;
                gap: 16px;
            }
            .photo-stream { gap: 50px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Nubian Platform</h1>
            <p class="subtitle">collection</p>
        </header>

        <main class="photo-stream">
            
            <!-- Entry 1 -->
            <div class="photo-row">
                <div class="photo-box">
                    <img src="images/Y67852006390-R1-020-8A copy.jpg" alt="Ghost Building">
                </div>
                <div class="text-box">
                    <div class="photo-date">September 23, 2026</div>
                    <p class="photo-caption">Ghost Building.</p>
                </div>
            </div>

            <!-- Entry 2 -->
            <div class="photo-row">

                </div>
                <div class="text-box">
                    <div class="photo-date">September 20, 2026</div>
                    <p class="photo-caption">Skating in the park</p>
                </div>
            </div>
            
            <!-- Entry 3 -->
            <div class="photo-row">

                </div>
                <div class="text-box">
                    <div class="photo-date">September 20, 2026</div>
                    <p class="photo-caption">Skating in the park</p>
                </div>
            </div>

            <!-- Entry 4 -->
            <div class="photo-row">

                </div>
                <div class="text-box">
                    <div class="photo-date">September 20, 2026</div>

            <!-- Entry 5 -->
            <div class="photo-row">

                    <img src="images/Y80862003327-R1-E005.jpg" alt="Skating in the park">
                </div>
                <div class="text-box">
                    <div class="photo-date">September 20, 2026</div>
                    <p class="photo-caption">Skating in the park</p>
                </div>
            </div>

            <!-- Entry 6 -->

        </main>

</body>
</html>
