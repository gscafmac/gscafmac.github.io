<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Photo Journal</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --caption-color: #666666;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            padding: 60px 0 40px 0;
        }
        h1 { margin: 0 0 10px 0; font-size: 2rem; font-weight: 600; }
        .subtitle { color: var(--caption-color); margin: 0; font-size: 1rem; }
        
        /* The Stream Layout */
        .photo-stream {
            display: flex;
            flex-direction: column;
            gap: 60px; /* Large space between each photo entry */
            margin-top: 40px;
        }
        .photo-entry {
            width: 100%;
        }
        .photo-entry img {
            width: 100%;
            height: auto; /* Keeps native image proportions instead of cropping */
            display: block;
            border-radius: 4px;
        }
        .caption-box {
            padding-top: 12px;
            max-width: 100%;
        }
        .photo-date {
            font-size: 0.8rem;
            color: var(--caption-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }
        .photo-caption {
            font-size: 0.95rem;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Photo Journal</h1>
            <p class="subtitle">A minimal stream of captured moments and thoughts.</p>
        </header>

        <main class="photo-stream">
            
            <!-- Photo Entry 1 -->
            <div class="photo-entry">
                <img src="images/Y67852006390-R1-020-8A copy.jpg" alt="Golden ocean sunset">
                <div class="caption-box">
                    <div class="photo-date">September 23, 2026</div>
                    <p class="photo-caption">Ghost Building.</p>
                </div>
            </div>

            <!-- Photo Entry 2 -->
            <div class="photo-entry">
                <img src="images/Y80862003327-R1-E005.jpg" alt="Coffee and notebook">
                <div class="caption-box">
                    <div class="photo-date">September 20, 2026</div>
                    <p class="photo-caption">Skating in the park</p>
                </div>
            </div>
            
            <!-- Future photos go right here following the exact same format -->

        </main>
    </div>

</body>
</html>
